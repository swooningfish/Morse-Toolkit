name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build debug APK
        run: gradle :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: morse-toolkit-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build APK with Docker
        run: docker build --output out .
      - name: Check the APK was produced
        run: ls -l out/*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Create Gradle wrapper (used by the Xcode build phase)
        run: gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
      - name: Compile Kotlin for iOS Simulator
        run: |
          set -o pipefail
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 2>&1 | tee kotlin.log
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen
          xcodegen --version; xcodebuild -version
          xcodebuild -list -project iosApp.xcodeproj
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Report errors
        if: failure()
        run: |
          # Annotations are visible without signing in, unlike the raw logs.
          cat kotlin.log xcodebuild.log 2>/dev/null | grep -E "^e: |error:|FAILED|What went wrong" -A2 | head -40 \
            | while IFS= read -r line; do echo "::error::$line"; done
